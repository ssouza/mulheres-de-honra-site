name: Deploy Mulheres de Honra Website to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssouza/mulheres-de-honra-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=main-{{sha}},enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        # Remove any existing kubectl config
        rm -rf ~/.kube
        mkdir -p ~/.kube
        
        # Decode and write kubeconfig
        echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Explicitly set KUBECONFIG for all subsequent steps
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        
        # Test connection
        kubectl cluster-info --request-timeout=30s
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

    - name: Create Docker Registry Secret
      run: |
        kubectl create secret docker-registry ghcr-secret \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username=${{ github.actor }} \
          --docker-password=${{ secrets.GITHUB_TOKEN }} \
          --docker-email=${{ github.actor }}@users.noreply.github.com \
          --namespace=app \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to Kubernetes
      run: |
        echo "=== Starting deployment ==="
        
        # Apply all manifests (deployment.yaml já tem a imagem correta)
        echo "=== Applying Kubernetes manifests ==="
        kubectl apply -f k8s/ --timeout=60s
        
        # Force restart deployment to pull new image
        kubectl rollout restart deployment/mulheres-de-honra -n app
        
        # Wait for rollout to complete
        echo "=== Waiting for rollout ==="
        kubectl rollout status deployment/mulheres-de-honra -n app --timeout=600s
        
        # Show deployment status
        echo "=== Deployment status ==="
        kubectl get pods -n app -l app=mulheres-de-honra
        kubectl get svc -n app
        kubectl get ingress -n app