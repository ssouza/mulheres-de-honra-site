name: Build and Deploy Mulheres de Honra Website

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssouza/mulheres-de-honra-site

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.version }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=main-{{sha}},enable={{is_default_branch}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NEXT_PUBLIC_BACKEND_API_KEY=${{ secrets.NEXT_PUBLIC_BACKEND_API_KEY }}
          NEXT_PUBLIC_EVOLUTION_API_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_EVOLUTION_API_PUBLIC_API_KEY }}


    - name: Build Summary
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "🏷️ Tags: ${{ steps.meta.outputs.tags }}"
        echo "🏗️ Platform: linux/arm64"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    # Só executa se o build for bem-sucedido
    if: success()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      run: |
        echo "🔧 Configuring kubectl..."
        
        # Remove any existing kubectl config
        rm -rf ~/.kube
        mkdir -p ~/.kube
        
        # Decode and write kubeconfig
        echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        
        # Explicitly set KUBECONFIG for all subsequent steps
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
        
        # Test connection
        echo "🔗 Testing cluster connection..."
        kubectl cluster-info --request-timeout=30s


    - name: Deploy to Kubernetes
      run: |
        echo "🚀 Starting deployment..."
        echo "📦 Using image: ${{ needs.build.outputs.image-tags }}"
        
        # Apply all manifests
        echo "📋 Applying Kubernetes manifests..."
        kubectl apply -f k8s/ --timeout=60s
        
        # Force restart deployment to pull new image
        echo "🔄 Restarting deployment to pull latest image..."
        kubectl rollout restart deployment/mulheres-de-honra -n app
        
        # Wait for rollout to complete
        echo "⏳ Waiting for rollout to complete..."
        kubectl rollout status deployment/mulheres-de-honra -n app --timeout=600s

    - name: Verify Deployment
      run: |
        echo "✅ Deployment verification:"
        echo ""
        echo "📊 Pod status:"
        kubectl get pods -n app -l app=mulheres-de-honra
        echo ""
        echo "🌐 Services:"
        kubectl get svc -n app | grep mulheres-de-honra || echo "Service not found"
        echo ""
        echo "🔗 Ingress:"
        kubectl get ingress -n app | grep mulheres-de-honra || echo "Ingress not found"

    - name: Post-deployment Check
      run: |
        echo "🏥 Post-deployment health check..."
        
        # Wait for pods to be ready
        sleep 20
        
        # Check if pods are running
        if kubectl get pods -n app -l app=mulheres-de-honra | grep -q "Running"; then
          echo "✅ Application is running successfully!"
          
          # Show recent logs
          echo "📝 Recent application logs:"
          kubectl logs -n app -l app=mulheres-de-honra --tail=5 || echo "No logs available yet"
        else
          echo "❌ Application is not running properly"
          echo "Pod status:"
          kubectl get pods -n app -l app=mulheres-de-honra
          echo "Pod details:"
          kubectl describe pods -n app -l app=mulheres-de-honra
          exit 1
        fi