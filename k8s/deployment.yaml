apiVersion: apps/v1
kind: Deployment
metadata:
  name: mulheres-de-honra
  namespace: app
  labels:
    app: mulheres-de-honra
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mulheres-de-honra
  template:
    metadata:
      labels:
        app: mulheres-de-honra
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: mulheres-de-honra
        image: ghcr.io/ssouza/mulheres-de-honra-site:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: mulheres-de-honra-config
        - secretRef:
            name: mulheres-de-honra-secrets
            optional: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: app-tmp
          mountPath: /tmp
      volumes:
      - name: app-tmp
        emptyDir: {}
