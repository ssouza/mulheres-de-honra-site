apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mulheres-de-honra-ingress
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/backend-protocol: "http"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - mulheresdehonra.com.br
    - www.mulheresdehonra.com.br
    secretName: mulheresdehonra-tls
  rules:
  - host: mulheresdehonra.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mulheres-de-honra-service
            port:
              number: 3000
  - host: www.mulheresdehonra.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mulheres-de-honra-service
            port:
              number: 3000
