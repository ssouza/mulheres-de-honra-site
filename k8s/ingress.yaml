apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mulheres-de-honra-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: mulheres-de-honra.mulherdehonra.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mulheres-de-honra-service
            port:
              number: 80
  tls:
  - hosts:
    - mulheres-de-honra.mulherdehonra.com.br
    secretName: mulheres-de-honra-tls
